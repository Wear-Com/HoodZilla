<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HoodZilla</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #faf7f2; --ink: #1a1a1a; --muted: #7a7468; --gold: #b8935a;
      --card: #ffffff; --red: #b03a2e; --green: #1f7a4d;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    html { -webkit-text-size-adjust: 100%; }
    body { font-family: 'Cairo', Tahoma, Arial, sans-serif; background: var(--bg); color: var(--ink); overflow-x: hidden; }

    .hero {
      background: linear-gradient(135deg, #1a1a1a 0%, #2e2a25 60%, #3b342b 100%);
      color: #fff; text-align: center; padding: 56px 20px 70px; position: relative; overflow: hidden;
    }
    .hero::before, .hero::after { content: ''; position: absolute; border-radius: 50%; border: 1px solid rgba(184,147,90,.35); }
    .hero::before { width: 380px; height: 380px; top: -170px; right: -120px; }
    .hero::after { width: 260px; height: 260px; bottom: -130px; left: -80px; }
    .brand { font-size: 14px; letter-spacing: 6px; color: var(--gold); margin-bottom: 14px; font-weight: 600; }
    .hero h1 { font-size: clamp(26px, 6vw, 52px); font-weight: 900; line-height: 1.3; margin-bottom: 12px; }
    .hero h1 span { color: var(--gold); }
    .hero p { color: #cfc8bb; font-size: clamp(14px, 2.4vw, 18px); max-width: 560px; margin: 0 auto; line-height: 1.7; }
    .line { width: 70px; height: 2px; background: var(--gold); margin: 22px auto 0; }

    .toolbar { max-width: 1200px; margin: -30px auto 0; padding: 0 16px; position: relative; z-index: 2; }
    .toolbar-box {
      background: #fff; border-radius: 14px; padding: 14px; box-shadow: 0 8px 30px rgba(0,0,0,.10);
      display: flex; flex-wrap: wrap; gap: 12px; align-items: center;
    }
    #search {
      flex: 1 1 240px; padding: 12px 16px; font-size: 16px; font-family: inherit;
      border: 1px solid #e3ddd2; border-radius: 10px; background: var(--bg); outline: none; min-width: 0;
    }
    #search:focus { border-color: var(--gold); }
    .chips { display: flex; gap: 8px; flex-wrap: wrap; }
    .chip {
      border: 1px solid #e3ddd2; background: #fff; padding: 9px 18px; border-radius: 30px;
      font-family: inherit; font-size: 14px; cursor: pointer; transition: .2s; color: var(--ink); white-space: nowrap;
    }
    .chip:hover { border-color: var(--gold); }
